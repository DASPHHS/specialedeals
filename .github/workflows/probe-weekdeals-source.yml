name: Probe nonfood HTML layout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-weekdeals-source.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect official public offer listing HTML
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):super().__init__();self.stack=[];self.count=0
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs);self.stack.append((tag,a))
                  href=a.get("href","")
                  if tag=="a" and ("/aanbieding/" in href or "/product/" in href):
                      if self.count<10:
                          print("OFFER_ANCHOR",href,"CLASS",a.get("class",""),"ANCESTORS",[(k,v.get("class","")) for k,v in self.stack[-5:]])
                      self.count+=1
              def handle_endtag(self,tag):
                  if self.stack:self.stack.pop()
          for url in ["https://folderwijzer.nl/winkel/kruidvat/",
                      "https://folderwijzer.nl/winkel/trekpleister/",
                      "https://folderwijzer.nl/winkel/xenos/"]:
              try:
                  req=Request(url,headers={"User-Agent":"WeekdealsBleiswijk/1.0 personal"})
                  with urlopen(req,timeout=25) as r:page=r.read().decode("utf-8","replace")
                  parser=P();parser.feed(page)
                  print("URL",url,"size",len(page),"offer_anchors",parser.count,
                        "html_head",page[:250].replace("\n"," "))
                  if parser.count==0:
                      for key in ("offer-card","offer-card__","product-card","aanbieding-card","offer-grid"):
                          print("LOOKUP",key,page.find(key))
                      idx=page.find("Lucovitaal")
                      print("SAMPLE",page[max(0,idx-450):idx+850].replace("\n"," ")[:1300])
              except Exception as e:print("ERROR",url,repr(e))
          PY

      - name: Check Folderz public listing accessibility and semantics
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from html.parser import HTMLParser
          class A(HTMLParser):
              def __init__(self):super().__init__();self.results=[];self.a=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="a" and ("/aanbieding" in a.get("href","") or "/actie" in a.get("href","")):
                      self.a={"href":a.get("href"),"class":a.get("class"),"text":""}
              def handle_data(self,txt):
                  if self.a:self.a["text"]+=txt[:70]
              def handle_endtag(self,tag):
                  if tag=="a" and self.a:
                      if len(self.results)<6:self.results.append(self.a)
                      self.a=None
          for url in ["https://www.folderz.nl/aanbiedingen/kruidvat",
                      "https://www.folderz.nl/aanbiedingen/trekpleister",
                      "https://www.folderz.nl/aanbiedingen/xenos"]:
              try:
                  with urlopen(Request(url,headers={"User-Agent":"WeekdealsBleiswijk/1.0"}),timeout=25) as r:
                      html=r.read().decode("utf-8","replace");status=r.status
                  p=A();p.feed(html)
                  print("FOLDERZ",url,"HTTP",status,"bytes",len(html),
                        "anchors",p.results,"script_json",html.find("application/ld+json"))
                  for key in ["Kruidvat lippenbalsem","Kruidvat","aanbieding-card","nu geldig"]:
                      idx=html.find(key)
                      if idx>=0:print("CONTEXT",key,html[max(0,idx-200):idx+300].replace("\n"," ")[:500])
              except Exception as e: print("FOLDERZ ERROR",url,repr(e))
          PY

      - name: Probe direct retailer and alternate public offer sources
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          for url in ["https://www.kruidvat.nl/aanbiedingen/dezeweek",
                      "https://www.trekpleister.nl/aanbiedingen",
                      "https://www.reclamefolder.nl/winkels/kruidvat/",
                      "https://feedmycart.nl/en/countries/netherlands/trekpleister/",
                      "https://www.action.com/nl-nl/weekactie/"]:
              try:
                  with urlopen(Request(url,headers={"User-Agent":"WeekdealsBleiswijk/1.0"}),timeout=25) as r:
                      html=r.read(250000).decode("utf-8","replace")
                      print("SOURCE",url,"HTTP",r.status,"html",len(html),
                            "title_at",html.find("<title"),"Kruidvat_at",html.find("Kruidvat"),
                            "offer_string",html.find("aanbieding"),"product_string",html.find("product"),
                            "snip",html[:140].replace("\n"," "))
              except Exception as e:print("SOURCE ERROR",url,repr(e))
          PY

      - name: Inspect FeedMyCart product list markup
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          for chain,term in [("etos","Oral-B"),("trekpleister","kruidnoten"),
                             ("action","Pet Dreamteam"),("wibra","€")]:
              url=f"https://feedmycart.nl/en/countries/netherlands/{chain}/"
              try:
                  with urlopen(Request(url,headers={"User-Agent":"WeekdealsBleiswijk/1.0"}),timeout=20) as r:html=r.read().decode("utf-8","replace")
                  at=html.lower().find(term.lower())
                  print("MARKUP",chain,"size",len(html),"term_idx",at,
                        "sample",html[max(at-700,0):at+700].replace("\n"," ")[:1400])
                  print("HTML_COUNTS",chain,"li",html.count("<li"),"table",html.count("<table"),
                        "old_del",html.count("<del"),"strikethrough",html.count("<s>"))
              except Exception as e:print("MARKUP ERROR",chain,repr(e))
          PY

      - name: Diagnose non-food visible cards with no euro price
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"integrations/weekdeals")
          from publish_nonfood_deals import DealParser,fetch,jsonld_products,money
          for chain in ("kruidvat","trekpleister","action","etos","wibra"):
              parser=DealParser(); parser.feed(fetch(chain))
              ld=jsonld_products(parser.scripts)
              print("DETAIL",chain,"cards",len(parser.items),"jsonld",len(ld))
              for r in parser.items[:8]:
                  print("CARD",chain,repr(r.get("name","")[:65]),
                        repr(r.get("new","")),repr(r.get("old","")),
                        repr(r.get("promotion","")[:100]),repr(r.get("category","")[:35]))
          PY

      - name: Diagnose JSON-LD vs visible product alignment
        run: |
          python - <<'PY'
          import sys
          from difflib import SequenceMatcher
          sys.path.insert(0,"integrations/weekdeals")
          from publish_nonfood_deals import DealParser,fetch,jsonld_products,money
          for chain in ("trekpleister","action","kruidvat"):
              parser=DealParser();parser.feed(fetch(chain))
              ld=jsonld_products(parser.scripts)
              print("ALIGN",chain,"cards",len(parser.items),"ld",len(ld))
              for i,(card,obj) in enumerate(zip(parser.items,ld)):
                  a=" ".join(card["name"].split());b=" ".join(str(obj.get("name") or "").split())
                  o=obj.get("offers") or {}
                  if i<12:
                      print("PAIR",chain,i,repr(a[:68]),repr(b[:68]),"similarity",round(SequenceMatcher(None,a.casefold(),b.casefold()).ratio(),3),
                            "price",card["new"],o.get("lowPrice"),"valid",o.get("priceValidUntil"))
          PY

      - name: Inspect official DA and Zeeman product markup
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request,urlopen
          for url in ("https://www.da.nl/aanbiedingen",
                      "https://www.zeeman.com/nl-nl/weekaanbiedingen",
                      "https://www.xenos.nl/folder",
                      "https://www.hema.nl/aanbiedingen"):
              try:
                  with urlopen(Request(url,headers={"User-Agent":"WeekdealsBleiswijk/1.0 (personal deal tracking)"}),timeout=30) as r:
                      s=r.read(900000).decode("utf-8","replace")
                      print("OFFICIAL",url,r.status,"bytes",len(s),"jsonld",s.count("application/ld+json"),
                            "product-key",s.lower().count('"@type":"product"'),
                            "link-products",s.lower().count("product-card"))
                      for term in ("Melatonine kids","Dames Sweater","Xenos week","__NEXT_DATA__"):
                          i=s.find(term)
                          if i!=-1:print("SNIP",url,term,s[max(0,i-320):i+480].replace("\n"," ")[:800])
              except Exception as e:print("OFFICIAL ERROR",url,repr(e))
          PY

      - name: Inspect exact DA SSR product card price and pagination
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          import re
          for url in ("https://www.da.nl/aanbiedingen", "https://www.da.nl/aanbiedingen?page=2"):
              try:
                  with urlopen(Request(url,headers={"User-Agent":"WeekdealsBleiswijk/1.0 personal"}),timeout=30) as r:s=r.read(2200000).decode("utf-8","replace")
                  print("DA",url,"length",len(s),"titles",s.count("ProductListItem-title"),
                        "prices",s.count("ProductListItem-price"),"items",s.count("ProductListItem"),"links",s.count("/product/"))
                  needle="ProductListItem-title"
                  i=s.find(needle)
                  if i>=0: print("DA-RAW",url,s[max(0,i-1100):i+3300].replace("\n"," ")[:4500])
                  for term in ("2+3 Gratis","priceCurrency","validUntil","salePrice","priceValue","ProductListItem"):
                      print("DA-HIT",term,s.find(term))
              except Exception as e:print("DA-ERROR",url,repr(e))
          PY

      - name: Inspect DA visible card selectors and prices
        run: |
          python -m pip -q install beautifulsoup4
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from urllib.request import Request,urlopen
          with urlopen(Request("https://www.da.nl/aanbiedingen",headers={"User-Agent":"WeekdealsBleiswijk/1.0"}),timeout=30) as r:s=r.read().decode("utf-8","replace")
          soup=BeautifulSoup(s,"html.parser")
          hs=soup.select("h2.ProductListItem-title")
          print("DA-BS4","productcount",len(hs))
          for h in hs[:3]:
              print("DA-TITLE",h.get_text(" ",strip=True))
              for i,p in enumerate(h.parents):
                  if i>6:break
                  print("DA-PARENT",i,p.name,p.get("class"),"txt",p.get_text(" ",strip=True)[-170:])
              parent=next((p for p in h.parents if p.get("class") and any("ProductListItem" in x and ("root" in x.lower() or "container" in x.lower()) for x in p.get("class",[]))),None)
              if parent:
                  print("DA-ROOT",str(parent)[:900])
                  for cls in ["ProductListPrice-root","price","decimal","ProductListItem-title"]:
                      x=parent.select("."+cls);print("DA-SELECT",cls,[y.get_text(" ",strip=True)[:60] for y in x[:5]])
          PY
