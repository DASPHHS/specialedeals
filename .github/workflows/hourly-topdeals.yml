name: Hourly personal Top 10
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  pull_request:
    paths:
      - "hourly_topdeals.py"
      - "test_hourly_topdeals.py"
      - "wishlist_pricewatch.py"
      - "probe_public_prices.py"
      - "public_price_peil.py"
      - "test_public_price_peil.py"
      - "test_wishlist_pricewatch.py"
      - "wishlist_radar.py"
      - "verlanglijst/app.js"
      - "wishlist_pricewatch.py"
      - "test_wishlist_pricewatch.py"
      - "wishlist_radar.py"
      - "verlanglijst/app.js"
      - "topdeals/**"
      - "wishlist.json"
      - ".github/workflows/hourly-topdeals.yml"
  push:
    branches: [main]
    paths:
      - "hourly_topdeals.py"
      - "test_hourly_topdeals.py"
      - "topdeals/index.html"
      - "topdeals/app.js"
      - "topdeals/style.css"
      - "wishlist.json"
      - ".github/workflows/hourly-topdeals.yml"
permissions:
  contents: write
concurrency:
  group: hourly-personal-top10
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression tests and UI syntax
        run: |
          python -m py_compile hourly_topdeals.py wishlist_pricewatch.py wishlist_radar.py public_price_peil.py
          python -m unittest -v test_hourly_topdeals.py test_wishlist_pricewatch.py test_wishlist_radar.py test_public_price_peil.py
          node --check topdeals/app.js
          node --check verlanglijst/app.js
          node ui/site-smoke.test.js
      - name: Inspect documented public price API responses
        if: github.event_name == 'pull_request'
        run: python probe_public_prices.py
      - name: Research specific Apple/Dyson/tech products via public Pricewatch suggestions
        if: github.event_name != 'pull_request'
        run: python wishlist_pricewatch.py --online
      - name: Build updated personal wishlist price comparisons
        run: python wishlist_radar.py
      - name: Read permitted Prijspuls public catalogue (do not mistake for SKU offers)
        if: github.event_name != 'pull_request'
        run: |
          if python public_price_peil.py; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("topdeals/prijspeil.json").read_text())
          assert p["source"]=="prijspuls.nl" and p["usablePriceLevels"]>=15
          assert all(not x["verifiedDiscount"] and not x["deliveredPriceVerified"]
                     for g in p["groups"].values() for x in g["top10"])
          print("Verified sourced generic market comparisons:",p["usablePriceLevels"])
          PY
          else
            echo "::warning::Prijspuls API not available; retain previous measurement without refreshing it"
          fi
      - name: Generate Top 10 from source snapshots
        run: python hourly_topdeals.py
      - name: Assert individual category count and discount semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("topdeals/data.json").read_text(encoding="utf-8"))
          assert len(d["categories"]) == 9
          prefs=json.loads(Path("wishlist.json").read_text(encoding="utf-8"))
          assert d["profileCount"]==len(prefs["searchProfiles"])==23
          assert d["profileOfferCount"]==sum(x["candidateCount"] for x in d["profileChecks"])
          assert d["profileComparisonCount"]==sum(x["comparisonCount"] for x in d["profileChecks"])
          assert all(c["verifiedDiscount"] is False and c["shippingVerified"] is False
              for p in d["profileChecks"] for c in p["comparisons"])
          assert [x["name"] for x in d["profileChecks"]]==[x["name"] for x in prefs["searchProfiles"]]
          assert all(x["candidateCount"]==0 for x in d["profileChecks"] if x["kind"] in ("service","event"))
          assert all(x["checkedAgainstFeedAt"] is None for x in d["profileChecks"] if x["kind"]!="product")
          assert all(not o["verifiedDeal"] for p in d["profileChecks"] for o in p["offers"])
          assert d["eligibleCount"] > 10, "Insufficient source offers"
          assert sum(x["usable"] for x in d["sourceHealth"]) >= 1
          for key,cat in d["categories"].items():
              assert len(cat["top10"])<=10
              assert len({x["id"] for x in cat["top10"]})==len(cat["top10"])
              for offer in cat["top10"]:
                  assert offer["verifiedDeal"] is False
                  assert offer["verifiedAllInPrice"] is False
                  assert offer["shippingEUR"] is None
                  assert offer["priceEUR"]>0 and offer["url"].startswith("https://")
                  if offer["advertisedDiscountPercent"] is not None:
                      assert offer["advertisedReferenceEUR"]>offer["priceEUR"]
          print("Verified data model: "+", ".join(k+" "+str(len(v["top10"])) for k,v in d["categories"].items()))
          PY
      - name: Publish hourly snapshot with concurrent-push retry
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp topdeals/data.json "$RUNNER_TEMP/top10-data.json"
          if [[ -f topdeals/prijspeil.json ]]; then cp topdeals/prijspeil.json "$RUNNER_TEMP/pricepeil.json"; fi
          cp verlanglijst/signalen.json "$RUNNER_TEMP/wishlist-signalen.json"
          cp verlanglijst/prijsvergelijkers.json "$RUNNER_TEMP/pricewatch-comparisons.json"
          code_sha=$(git hash-object hourly_topdeals.py)
          public_sha=$(git hash-object public_price_peil.py)
          price_sha=$(git hash-object wishlist_pricewatch.py)
          radar_sha=$(git hash-object wishlist_radar.py)
          wish_sha=$(git hash-object wishlist.json)
          for attempt in 1 2 3 4 5; do
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            if [[ "$(git show origin/main:public_price_peil.py | git hash-object --stdin)" != "$public_sha" ]] ||
               [[ "$(git show origin/main:wishlist_pricewatch.py | git hash-object --stdin)" != "$price_sha" ]] ||
               [[ "$(git show origin/main:wishlist_radar.py | git hash-object --stdin)" != "$radar_sha" ]] ||
               [[ "$(git show origin/main:hourly_topdeals.py | git hash-object --stdin)" != "$code_sha" ]] ||
               [[ "$(git show origin/main:wishlist.json | git hash-object --stdin)" != "$wish_sha" ]]; then
              echo "Code or preferences changed during ranking; refusing stale publish"
              exit 0
            fi
            git checkout -f main
            git reset --hard origin/main
            mkdir -p topdeals
            cp "$RUNNER_TEMP/top10-data.json" topdeals/data.json
            if [[ -f "$RUNNER_TEMP/pricepeil.json" ]]; then cp "$RUNNER_TEMP/pricepeil.json" topdeals/prijspeil.json; fi
            mkdir -p verlanglijst
            cp "$RUNNER_TEMP/wishlist-signalen.json" verlanglijst/signalen.json
            cp "$RUNNER_TEMP/pricewatch-comparisons.json" verlanglijst/prijsvergelijkers.json
            git add topdeals/data.json verlanglijst/signalen.json verlanglijst/prijsvergelijkers.json
            if [[ -f topdeals/prijspeil.json ]]; then git add topdeals/prijspeil.json; fi
            if git diff --cached --quiet; then
              echo "No changed result";exit 0
            fi
            git commit -m "Hourly category Top 10 [skip ci]"
            if git push origin HEAD:main; then
              echo "### Hourly top 10 published" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Concurrent publication; retry $attempt"
            sleep $((attempt*2))
          done
          exit 1
