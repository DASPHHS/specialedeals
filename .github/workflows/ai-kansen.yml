name: AI Kansen radar
on:
  push:
    branches: [main]
    paths:
      - 'ai_kansen_research.py'
      - 'test_ai_kansen.py'
      - '.github/workflows/ai-kansen.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 6 * * *'
concurrency:
  group: specialedeals-scanner
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and refresh AI opportunities
        run: |
          python -m py_compile ai_kansen_research.py
          python -m unittest test_ai_kansen.py -v
          python ai_kansen_research.py
          python system_health.py
      - name: Publish changed AI insights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-kansen-kandidaten.json system-health.json
          if ! git diff --cached --quiet; then
            git commit -m "Update curated AI and Reddit opportunities"
            git pull --rebase origin main
            git push origin main
          fi
