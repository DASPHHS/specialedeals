name: Weekdeals NL to Google Sheets

on:
  push:
    paths:
      - "integrations/weekdeals/**"
      - ".github/workflows/weekdeals-google-sheets.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *" # 06:30 CET / 07:30 CEST

permissions:
  contents: read

concurrency:
  group: weekdeals-google-sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Google Sheets client
        run: python -m pip install "gspread>=6.1,<7"
      - name: Run importer tests
        env:
          PYTHONPATH: integrations/weekdeals
        run: python -m unittest discover -s integrations/weekdeals/tests -v
      - name: Verify live source API
        run: python integrations/weekdeals/sync_deals.py --check-api
      - name: Update personal Google Sheet when authorized
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PRIJSPROFEET_API_KEY: ${{ secrets.PRIJSPROFEET_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" || -z "$GOOGLE_SHEET_ID" ]]; then
            echo "::warning::Google Sheets not connected: add GOOGLE_SERVICE_ACCOUNT_JSON and GOOGLE_SHEET_ID as repository secrets"
            echo "Google Sheets sync SKIPPED: authorization required." >> "$GITHUB_STEP_SUMMARY"
          else
            python integrations/weekdeals/sync_deals.py
            echo "Google Sheets sync completed." >> "$GITHUB_STEP_SUMMARY"
          fi
