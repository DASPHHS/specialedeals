name: Speciale Deals scan
on:
  push:
    branches: [main]
    paths: ['scan.py', 'index.html', '.github/workflows/scan.yml']
  workflow_dispatch:
  schedule:
    - cron: '20 5,7,11,15,19 * * *'
permissions:
  contents: write
concurrency:
  group: specials-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scanner
        run: python -m py_compile scan.py
      - name: Read public sources
        run: python scan.py
      - name: Validate output
        run: python -m json.tool data.json > /dev/null
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update offers from public sources"
            git pull --rebase origin main
            git push origin main
          fi
