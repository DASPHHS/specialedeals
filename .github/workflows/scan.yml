name: Speciale Deals dagelijkse scan
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7,17 * * *'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scanner syntax and configuration
        run: |
          python -m py_compile scan.py
          python -m json.tool radar-config.json > /dev/null
      - name: Scan feeds
        run: python scan.py
      - name: Publiceer resultaten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-deals.json
          if ! git diff --cached --quiet; then
            git commit -m "Update persoonlijke deals"
            git push
          fi
