name: Speciale Deals scan
on:
  push:
    branches: [main]
    paths: ['scan.py', 'price_engine.py', 'test_price_engine.py', 'price-observations.json', 'bronnenregister.json', 'onderzoeksplan.json', 'huishoudradar-config.json', 'prijsradar-config.json', 'test_research_plan.py', 'candidate_quality.py', 'test_candidate_quality.py', 'deal_verification.py', 'test_pricegate.py', 'test_outdoor.py', 'test_watchlist.py', 'discover_winacties.py', 'verified-deals.json', 'verified-winacties.json', 'wishlist.json', 'radar-profiel.json', 'prijsradar-config.json', 'huisprojecten.json', 'winactie-profiel.json', 'index.html', '.github/workflows/scan.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: specials-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scanner
        run: python -m py_compile scan.py discover_winacties.py deal_verification.py candidate_quality.py price_engine.py
      - name: Test preferences, wishlist and outdoor filtering
        run: python -m unittest -v test_outdoor.py test_watchlist.py test_pricegate.py test_candidate_quality.py test_price_engine.py test_research_plan.py
      - name: Read public sources
        run: python scan.py
      - name: Calculate verified pricepeil from evidence only
        run: python price_engine.py
      - name: Discover major NL and international giveaways
        run: python discover_winacties.py
      - name: Validate output
        run: |
          python -m json.tool data.json > /dev/null
          python -m json.tool winactie-kandidaten.json > /dev/null
          python -m json.tool deal-kandidaten.json > /dev/null
          python -m json.tool verified-pricepeil.json > /dev/null
          python -m json.tool bronnenregister.json > /dev/null
          python -m json.tool onderzoeksplan.json > /dev/null
      - name: Publish results safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data.json "$RUNNER_TEMP/data.json"
          cp winactie-kandidaten.json "$RUNNER_TEMP/winactie-kandidaten.json"
          cp deal-kandidaten.json "$RUNNER_TEMP/deal-kandidaten.json"
          cp verified-pricepeil.json "$RUNNER_TEMP/verified-pricepeil.json"
          source_scanner=$(git hash-object scan.py)
          for attempt in 1 2 3; do
            git fetch origin main
            latest_scanner=$(git show origin/main:scan.py | git hash-object --stdin)
            if [[ "$source_scanner" != "$latest_scanner" ]]; then
              echo "Scanner changed while this run was active; skipping stale output."
              exit 0
            fi
            git reset --hard origin/main
            cp "$RUNNER_TEMP/data.json" data.json
            cp "$RUNNER_TEMP/winactie-kandidaten.json" winactie-kandidaten.json
            cp "$RUNNER_TEMP/deal-kandidaten.json" deal-kandidaten.json
            cp "$RUNNER_TEMP/verified-pricepeil.json" verified-pricepeil.json
            git add data.json winactie-kandidaten.json deal-kandidaten.json verified-pricepeil.json
            if git diff --cached --quiet; then
              echo "Nothing changed."
              exit 0
            fi
            git commit -m "Update public offers and giveaway candidates"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update; retrying publish ($attempt/3)."
          done
          echo "Could not publish after 3 attempts." >&2
          exit 1
