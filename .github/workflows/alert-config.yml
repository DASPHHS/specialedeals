name: Speciale Deals alertinstellingen
on:
  issues:
    types: [opened]
concurrency:
  group: specialedeals-scanner
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  watch:
    if: github.event.issue.user.login == 'DASPHHS' && startsWith(github.event.issue.body, 'SPECIALDEALS-WATCH-V1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test request parser
        run: python -m unittest test_watchlist_issue.py -v
      - name: Apply verified owner request
        run: python watchlist_issue.py
      - name: Publish watchlist change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.json
          if ! git diff --cached --quiet; then
            git commit -m "Update personal watchlist from owner issue"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Owner watchlist change conflicted; issue remains open."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Owner watchlist published."
                exit 0
              fi
              sleep $((attempt * 3))
            done
            echo "::error::Owner watchlist could not be published safely."
            exit 1
          fi
      - name: Close processed request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NO: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NO" --repo "$GH_REPO" --comment "Volglijst verwerkt. Controleer de actuele lijst op de website. De eerstvolgende scanner- en ChatGPT-taakrun gebruikt de nieuwe voorkeur."
