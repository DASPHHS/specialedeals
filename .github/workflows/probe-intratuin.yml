name: Probe public nonfood offers (Intratuin)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe-intratuin.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip -q install beautifulsoup4
      - name: Check official shop offer cards
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from urllib.request import Request,urlopen
          urls=["https://www.intratuin.nl/aanbiedingen",
                "https://www.intratuin.nl/aanbiedingen?p=2",
                "https://www.gamma.nl/aanbiedingen-en-acties",
                "https://www.praxis.nl/acties"]
          for url in urls:
            try:
              with urlopen(Request(url,headers={"User-Agent":"WeekdealsBleiswijk/1.0 personal offer tracker","Accept":"text/html"}),timeout=35) as r:
                s=r.read(3000000).decode("utf-8","replace")
              soup=BeautifulSoup(s,"html.parser")
              print("SOURCE",url,"html",len(s),"title",soup.title.get_text(" ",strip=True)[:95] if soup.title else "",
                "product-items",len(soup.select(".product-item")),"special-price",len(soup.select(".special-price")),
                "productlinks",len(soup.select(".product-item-link")))
              for card in soup.select(".product-item")[:4]:
                name=card.select_one(".product-item-link")
                print("CARD",url,"name",name.get_text(" ",strip=True)[:110] if name else "",
                      "href",name.get("href") if name else "",
                      "special",[x.get_text(" ",strip=True)[:50] for x in card.select(".special-price .price")[:2]],
                      "normal",[x.get_text(" ",strip=True)[:50] for x in card.select(".old-price .price")[:2]],
                      "total",card.get_text(" ",strip=True)[-200:])
                if card==soup.select(".product-item")[0]:print("CARDHTML",str(card)[:2700].replace("\n"," "))
            except Exception as e:print("ERROR",url,type(e).__name__,str(e)[:160])
          PY
