name: Probe nonfood HTML layout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-weekdeals-source.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect official public offer listing HTML
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):super().__init__();self.stack=[];self.count=0
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs);self.stack.append((tag,a))
                  href=a.get("href","")
                  if tag=="a" and ("/aanbieding/" in href or "/product/" in href):
                      if self.count<10:
                          print("OFFER_ANCHOR",href,"CLASS",a.get("class",""),"ANCESTORS",[(k,v.get("class","")) for k,v in self.stack[-5:]])
                      self.count+=1
              def handle_endtag(self,tag):
                  if self.stack:self.stack.pop()
          for url in ["https://folderwijzer.nl/winkel/kruidvat/",
                      "https://folderwijzer.nl/winkel/trekpleister/",
                      "https://folderwijzer.nl/winkel/xenos/"]:
              try:
                  req=Request(url,headers={"User-Agent":"WeekdealsBleiswijk/1.0 personal"})
                  with urlopen(req,timeout=25) as r:page=r.read().decode("utf-8","replace")
                  parser=P();parser.feed(page)
                  print("URL",url,"size",len(page),"offer_anchors",parser.count,
                        "html_head",page[:250].replace("\n"," "))
                  if parser.count==0:
                      for key in ("offer-card","offer-card__","product-card","aanbieding-card","offer-grid"):
                          print("LOOKUP",key,page.find(key))
                      idx=page.find("Lucovitaal")
                      print("SAMPLE",page[max(0,idx-450):idx+850].replace("\n"," ")[:1300])
              except Exception as e:print("ERROR",url,repr(e))
          PY

      - name: Check Folderz public listing accessibility and semantics
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from html.parser import HTMLParser
          class A(HTMLParser):
              def __init__(self):super().__init__();self.results=[];self.a=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="a" and ("/aanbieding" in a.get("href","") or "/actie" in a.get("href","")):
                      self.a={"href":a.get("href"),"class":a.get("class"),"text":""}
              def handle_data(self,txt):
                  if self.a:self.a["text"]+=txt[:70]
              def handle_endtag(self,tag):
                  if tag=="a" and self.a:
                      if len(self.results)<6:self.results.append(self.a)
                      self.a=None
          for url in ["https://www.folderz.nl/aanbiedingen/kruidvat",
                      "https://www.folderz.nl/aanbiedingen/trekpleister",
                      "https://www.folderz.nl/aanbiedingen/xenos"]:
              try:
                  with urlopen(Request(url,headers={"User-Agent":"WeekdealsBleiswijk/1.0"}),timeout=25) as r:
                      html=r.read().decode("utf-8","replace");status=r.status
                  p=A();p.feed(html)
                  print("FOLDERZ",url,"HTTP",status,"bytes",len(html),
                        "anchors",p.results,"script_json",html.find("application/ld+json"))
                  for key in ["Kruidvat lippenbalsem","Kruidvat","aanbieding-card","nu geldig"]:
                      idx=html.find(key)
                      if idx>=0:print("CONTEXT",key,html[max(0,idx-200):idx+300].replace("\n"," ")[:500])
              except Exception as e: print("FOLDERZ ERROR",url,repr(e))
          PY

      - name: Probe direct retailer and alternate public offer sources
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          for url in ["https://www.kruidvat.nl/aanbiedingen/dezeweek",
                      "https://www.trekpleister.nl/aanbiedingen",
                      "https://www.reclamefolder.nl/winkels/kruidvat/",
                      "https://feedmycart.nl/en/countries/netherlands/trekpleister/",
                      "https://www.action.com/nl-nl/weekactie/"]:
              try:
                  with urlopen(Request(url,headers={"User-Agent":"WeekdealsBleiswijk/1.0"}),timeout=25) as r:
                      html=r.read(250000).decode("utf-8","replace")
                      print("SOURCE",url,"HTTP",r.status,"html",len(html),
                            "title_at",html.find("<title"),"Kruidvat_at",html.find("Kruidvat"),
                            "offer_string",html.find("aanbieding"),"product_string",html.find("product"),
                            "snip",html[:140].replace("\n"," "))
              except Exception as e:print("SOURCE ERROR",url,repr(e))
          PY

      - name: Inspect FeedMyCart product list markup
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          for chain,term in [("etos","Oral-B"),("trekpleister","kruidnoten"),
                             ("action","Pet Dreamteam"),("wibra","€")]:
              url=f"https://feedmycart.nl/en/countries/netherlands/{chain}/"
              try:
                  with urlopen(Request(url,headers={"User-Agent":"WeekdealsBleiswijk/1.0"}),timeout=20) as r:html=r.read().decode("utf-8","replace")
                  at=html.lower().find(term.lower())
                  print("MARKUP",chain,"size",len(html),"term_idx",at,
                        "sample",html[max(at-700,0):at+700].replace("\n"," ")[:1400])
                  print("HTML_COUNTS",chain,"li",html.count("<li"),"table",html.count("<table"),
                        "old_del",html.count("<del"),"strikethrough",html.count("<s>"))
              except Exception as e:print("MARKUP ERROR",chain,repr(e))
          PY
