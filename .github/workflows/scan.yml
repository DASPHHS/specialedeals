name: Scan Speciale Deals
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6,7,11,15,19 * * *'
permissions:
  contents: write
concurrency:
  group: speciale-deals-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile scan.py
      - name: Scan public listings
        run: python scan.py
      - name: Publish scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update openbare aanbiedingenradar"
            git pull --rebase origin main
            git push origin main
          fi
