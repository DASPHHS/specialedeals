name: Speciale Deals dagelijkse scan
on:
  push:
    branches: [main]
    paths:
      - 'scan.py'
      - 'radar-config.json'
      - 'test_scan.py'
      - 'merchant_check.py'
      - 'test_merchant_check.py'
      - 'shop-targets.json'
      - 'watchlist.json'
      - 'watchlist_issue.py'
      - 'test_watchlist_issue.py'
      - 'site_check.py'
      - 'index.html'
      - 'ai-kansen.html'
      - '.github/workflows/scan.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 7,12,17,21 * * *'
concurrency:
  group: specialedeals-scanner
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scanner syntax and configuration
        run: |
          python -m py_compile scan.py
          python -m json.tool radar-config.json > /dev/null
          python -m unittest test_scan.py test_merchant_check.py test_watchlist_issue.py -v
          python -m json.tool shop-targets.json > /dev/null
      - name: Scan feeds
        run: python scan.py
      - name: Check exact merchant product prices
        run: python merchant_check.py
      - name: Test dashboard and published JSON schema
        run: python site_check.py
      - name: Publiceer resultaten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-deals.json merchant-observations.json price-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update persoonlijke deals"
            git pull --rebase origin main
            git push origin main
          fi
